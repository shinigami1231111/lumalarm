<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Punch the system bus default policy (<deny own="*"/>, <deny send_type="method_call"/>)
  for org.lumalarm.Helper. Required for activation: the root-run helper must be
  able to own its well-known name, and clients must be able to send method
  calls. Non-root callers are then gated INSIDE the helper by the polkit action
  org.lumalarm.schedule.wake (auth_admin_keep).
-->
<busconfig>
  <policy user="root">
    <allow own="org.lumalarm.Helper"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.lumalarm.Helper"/>
  </policy>
</busconfig>
