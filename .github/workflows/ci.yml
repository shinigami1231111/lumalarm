name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only ever read the repository; no token scopes beyond that.
permissions:
  contents: read

# Superseded runs for the same ref are pointless — cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Container: Ubuntu 26.04 ─────────────────────────────────────
          # Ubuntu 24.04 ships Qt 6.4.2, below the project's Qt >= 6.5
          # minimum, so Configure failed there. Questing/Resolute ship Qt
          # 6.9+/6.10. qt6-tools-dev is REQUIRED: qt_add_executable() calls
          # Qt6::WrapCpp (from Qt6CoreTools) for the QML module.
          - name: Ubuntu 26.04
            os: ubuntu-24.04
            container: ubuntu:26.04
            packages: >-
              cmake ninja-build g++
              qt6-base-dev qt6-base-dev-tools qt6-declarative-dev
              qt6-multimedia-dev qt6-tools-dev
            kde_blur: "OFF"

          # ── Container: Fedora 40 ────────────────────────────────────────
          # KDE blur stays OFF: KF6WindowSystem lives in a different
          # Fedora module set and is not needed for CI.
          - name: Fedora 40
            os: ubuntu-24.04
            container: fedora:40
            packages: >-
              cmake ninja-build gcc-c++
              qt6-qtbase-devel qt6-qtdeclarative-devel
              qt6-qtmultimedia-devel qt6-qttools-devel
            kde_blur: "OFF"

          # ── Container: Arch Linux ───────────────────────────────────────
          # Rolling release; the newest available Qt 6 is exercised here.
          # KDE blur stays OFF: KF6WindowSystem is not available in a
          # base archlinux container.
          - name: Arch Linux
            os: ubuntu-24.04
            container: archlinux:latest
            packages: base-devel cmake ninja qt6-base qt6-declarative qt6-multimedia qt6-tools
            kde_blur: "OFF"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Container jobs start as root; the host runner uses sudo. Detect the
      # package manager instead of branching on the container field, so apt
      # works both on the runner and inside the Ubuntu container.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          fi

          if command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y dnf-plugins-core
            $SUDO dnf install -y ${{ matrix.packages }}
          elif command -v pacman >/dev/null 2>&1; then
            # Keep in sync with PKGBUILD: update the base system first, then
            # install the toolchain and Qt 6 packages.
            $SUDO pacman -Syu --needed --noconfirm
            $SUDO pacman -S --needed --noconfirm ${{ matrix.packages }}
          elif command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends ${{ matrix.packages }}
          else
            echo "No supported package manager in ${{ matrix.name }}" >&2
            exit 1
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUMALARM_ENABLE_KDE_BLUR=${{ matrix.kde_blur }}

      - name: Build
        shell: bash
        run: |
          jobs=$(( $(nproc) * 80 / 100 ))
          [ "$jobs" -lt 1 ] && jobs=1
          cmake --build build -j"$jobs"

      - name: Test
        shell: bash
        run: |
          set +e
          # Surface the headless environment in public check-run annotations:
          # these are the variables that can change Qt's platform/plugin choice
          # between the host runner and the three containers.
          echo "::notice::env HOME=${HOME:-<unset>} DISPLAY=${DISPLAY:-<unset>} QT_QPA_PLATFORM=${QT_QPA_PLATFORM:-<unset>} TMPDIR=${TMPDIR:-<unset>} XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-<unset>} LANG=${LANG:-<unset>} nproc=$(nproc)"
          ctest --test-dir build --output-on-failure 2>&1 | tee /tmp/ctest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Workflow commands turn the failure summary into public check-run
            # annotations, so a failing container can be diagnosed without
            # downloading the (auth-gated) job log or ctest artifact.
            grep -E 'FAIL!|The following tests FAILED|^[[:space:]]*[0-9]+- ' /tmp/ctest.log \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$rc"

      - name: Upload ctest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.name }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
